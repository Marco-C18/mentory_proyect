<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MentorEdu</title>

    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    <a href="/" class="btn-flotante" title="Volver al inicio">
        <i class="fa-solid fa-house"></i>
    </a>

    <section class="card-container">
        <section class="visual-card">
            <img th:src="@{/img/forms/registro_mentory.png}" alt="Registro MentorEdu">
        </section>

        <section class="form-card">
            <p class="Title">Crear cuenta | Aprendiz</p>

            <section class="google">
                <i class="fa-brands fa-google"></i>
                <p class="label">Usa tu gmail para registrarte</p>
            </section>

            <!-- Alerta de error moderna -->
            <div th:if="${error}" class="alert alert-error">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span class="alert-text" th:text="${error}">Error al registrar usuario</span>
            </div>

            <form th:action="@{/registro/aprendiz}" th:object="${aprendiz}" method="post">
                <div class="input-group">
                    <div class="input-icon">
                        <input type="text" th:field="*{nombreUsuario}" placeholder="Nombre" required />
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <input type="text" th:field="*{phoneUsuario}" placeholder="Teléfono" required />
                        <i class="fa-solid fa-phone"></i>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <input type="email" th:field="*{emailUsuario}" placeholder="Email" required />
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <input type="password" th:field="*{contraseñaUsuario}" placeholder="Contraseña" required />
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <div class="input-group ciclo">
                    <div class="label"> <i class="fa-solid fa-graduation-cap"></i> <label for="cicloAcademico"
                            class="select-label">Ciclo académico</label> </div>
                    <div class="input-icon"> <select id="cicloAcademico" th:field="*{cicloAcademico}" required>
                            <option value="" disabled selected>Selecciona tu ciclo</option>
                            <option value="I Ciclo">I Ciclo</option>
                            <option value="II Ciclo">II Ciclo</option>
                            <option value="III Ciclo">III Ciclo</option>
                            <option value="IV Ciclo">IV Ciclo</option>
                            <option value="V Ciclo">V Ciclo</option>
                            <option value="VI Ciclo">VI Ciclo</option>
                        </select> </div>
                </div>

                <div class="input-group interes">
                    <label class="title" for="interesesAprendiz">Intereses de aprendizaje</label>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" th:field="*{interesesAprendiz}" name="interesesAprendiz"
                                value="Programación"> Programación
                        </label>
                        <label>
                            <input type="checkbox" th:field="*{interesesAprendiz}" name="interesesAprendiz"
                                value="Matemáticas"> Matemáticas
                        </label>
                        <label>
                            <input type="checkbox" th:field="*{interesesAprendiz}" name="interesesAprendiz"
                                value="Ciencias"> Ciencias
                        </label>
                        <label>
                            <input type="checkbox" th:field="*{interesesAprendiz}" name="interesesAprendiz"
                                value="Idiomas"> Idiomas
                        </label>
                        <label>
                            <input type="checkbox" th:field="*{interesesAprendiz}" name="interesesAprendiz"
                                value="Arte"> Arte
                        </label>
                    </div>
                </div>

                <div class="button-container">
                    <button type="submit">REGISTRARSE</button>
                </div>
            </form>
            <div class="iniciar-sesion">
                <p>¿Ya tienes una cuenta?</p>
                <a href="/login">Iniciar sesión</a>
            </div>
        </section>
    </section>

    <script th:if="${showSuccessModal}">
        showSuccessModal('[[${successMessage}]]');
    </script>
    <script th:src="@{/js/register.js}"></script>
</body>

</html>
