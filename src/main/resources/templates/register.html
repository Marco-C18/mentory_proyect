<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MentorEdu</title>

    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    
    <section class="card-container">
        <section class="visual-card">
            <img th:src="@{/img/forms/registro_mentory.png}" alt="Registro MentorEdu">
        </section>

        <section class="form-card">
            <p class="Title">Crear cuenta</p>

            <section class="google" onclick="signInWithGoogle()" style="cursor: pointer;">
                <i class="fa-brands fa-google"></i>
                <p class="label">Usa tu gmail para registrarte</p>
            </section>

            <!-- Alerta de error moderna -->
            <div th:if="${error}" class="alert alert-error">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span class="alert-text" th:text="${error}">Error al registrar usuario</span>
            </div>

            <form th:action="@{/registro}" th:object="${usuario}" method="post">
                <div class="input-group">
                    <div class="input-icon">
                        <input type="text" th:field="*{nombreUsuario}" placeholder="Nombre completo" required />
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <!-- <div class="input-group">
                    <div class="input-icon">
                        <input type="text" th:field="*{phoneUsuario}" placeholder="Teléfono" required />
                        <i class="fa-solid fa-phone"></i>
                    </div>
                </div> -->

                <div class="input-group">
                    <div class="input-icon">
                        <input type="email" th:field="*{emailUsuario}" placeholder="Email" required />
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <input type="password" th:field="*{contraseñaUsuario}" name="contraseñaUsuario" placeholder="Contraseña" required />
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <div class="button-container">
                    <button type="submit">CONTINUAR</button>
                </div>
            </form>

            <div class="iniciar-sesion">
                <p>¿Ya tienes una cuenta?</p>
                <a href="/login">Iniciar sesión</a>
            </div>
        </section>
    </section>

    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Tu configuración de Firebase (REEMPLAZA CON TUS DATOS)
        const firebaseConfig = {
            apiKey: "AIzaSyAH1hmNnWDN1_R7V5dyEf10Q6JpjGgjIsg",
            authDomain: "mentory-proyect.firebaseapp.com",
            projectId: "mentory-proyect",
            storageBucket: "mentory-proyect.firebasestorage.app",
            messagingSenderId: "561447271573",
            appId: "1:561447271573:web:7aad6ec47c20e25850af9c"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Función para login con Google
        window.signInWithGoogle = async function() {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                console.log("✅ Usuario autenticado:", user);
                console.log("📧 Email:", user.email);
                console.log("👤 Nombre:", user.displayName);

                // Obtener el token de Firebase
                const idToken = await user.getIdToken();

                // Enviar el token al backend
                const response = await fetch('/auth/google', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        idToken: idToken,
                        email: user.email,
                        nombre: user.displayName,
                        photoURL: user.photoURL
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Redirigir según el estado del usuario
                    window.location.href = data.redirectUrl;
                } else {
                    alert('Error al autenticar con Google');
                }

            } catch (error) {
                console.error("❌ Error en Google Sign-In:", error);
                alert('Error al iniciar sesión con Google: ' + error.message);
            }
        };
    </script>

    <script th:src="@{/js/register.js}"></script>
</body>

</html>
