<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-sky-700 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            
            <!-- Header -->
            <div class="bg-sky-900 p-8 text-center">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <svg class="w-10 h-10 text-sky-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">Panel de Administración</h1>
                <p class="text-sky-100 text-sm">Ingresa tu contraseña para continuar</p>
            </div>

            <!-- Form -->
            <div class="p-8">
                <!-- Error Message -->
                <div th:if="${error}" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded">
                    <div class="flex items-center">
                        <span class="text-red-500 mr-2"></span>
                        <p class="text-red-700 text-sm font-medium" th:text="${error}">Error message</p>
                    </div>
                </div>

                <form th:action="@{/admin/login}" method="post" class="space-y-6">
                    <div>
                        <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                            Contraseña de Administrador
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required
                            autofocus
                            placeholder="••••••••"
                            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-sky-900 focus:ring-2 focus:ring-sky-200 transition-all duration-200"
                        />
                    </div>

                    <button 
                        type="submit"
                        class="w-full bg-sky-900 text-white font-semibold py-3 rounded-lg hover:bg-sky-700 transform hover:scale-[1.02] transition-all duration-200 shadow-lg hover:shadow-xl"
                    >
                        Acceder al Panel
                    </button>
                </form>

                <!-- Info -->
                <div class="mt-6 pt-6 border-t border-gray-200">
                    <p class="text-center text-xs text-gray-500">
                        Acceso restringido solo para administradores
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
